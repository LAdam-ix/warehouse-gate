services:
  backend:
    build: ./backend
    restart: always
    environment:
      - DB_DIR=/app/db
      - MEDIA_ROOT=/app/media
    volumes:
      - ./data/db:/app/db
      - ./data/media:/app/media

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8273:80"
    depends_on:
      - backend

  pos:
    build: ./pos
    restart: always
    ports:
      - "7646:80"
    depends_on:
      - backend
